stages:
  - build
  - test
  - deploy

variables:
  CUSTOMER_NAME:
    description: "The friendly name for the Customer."
  CUSTOMER_UUID:
    description: "A cryptographic hash of CUSTOMER_NAME for uniqueness."

build-job:
  stage: build
  script:
    - echo "Building application for $CUSTOMER_NAME!"
    - ./scripts/init-customer.py $CUSTOMER_NAME $CUSTOMER_UUID
  retry:
    max: 3
    when:
      - runner_system_failure
      - job_execution_timeout
    exit_codes:
      - 137

test-job:
  stage: test
  script:
    - echo "Verifying application for $CUSTOMER_NAME!"
    - ./scripts/verify-customer.py
  retry:
    max: 3
    when:
      - runner_system_failure
      - job_execution_timeout
    exit_codes:
      - 137

deploy-job:
  stage: deploy
  script:
    - echo "Deploying application for $CUSTOMER_NAME!"
    - kubectl create namespace $CUSTOMER_UUID
    - helm repo add nginx-stable https://helm.nginx.com/stable
    - helm repo update
    - helm install nginx-stable/nginx-ingress \
      -n $CUSTOMER_UUID \
      --create-namespace \
      --version $PROD_VERSION
    - kubectl apply -f http-payload.yaml
    - ./scripts/alert-customer.py
  retry:
    max: 3
    when:
      - runner_system_failure
      - job_execution_timeout
    exit_codes:
      - 137
